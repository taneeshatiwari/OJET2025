<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Page</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>

<h2>Home Page</h2>
<p>
  Name: <span id="name"></span><br>
  Email: <span id="email"></span><br>
  Address: <span id="address"></span>
</p>

<script>
  
  document.getElementById("name").textContent = sessionStorage.getItem("name");
  document.getElementById("email").textContent = sessionStorage.getItem("email");
  document.getElementById("address").textContent = sessionStorage.getItem("address");
</script>

</body>
</html>
